<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Never-Existed Arcade</title>
<style>
:root{--bg:#d6ecea;--ink:#1b2a41;--cell:#f3fbfa;--sun:#f4c430;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b2b;--ink:#e3f1f0;--cell:#1b2a41}}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;padding:40px 16px;display:flex;flex-direction:column;align-items:center}
h1{font-size:2.2rem;margin:0 0 6px;letter-spacing:-.02em}
main{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));max-width:640px;width:100%;margin-top:24px}
a.g{display:block;background:var(--cell);border:3px solid var(--ink);border-radius:14px;padding:18px;color:inherit;text-decoration:none}
a.g:hover,a.g:focus-visible{background:var(--sun);color:#1b2a41;outline:none}
a.g b{font-size:1.3rem}
</style></head>
<body>
<h1>Never-Existed Arcade</h1>
<p>Original puzzle games in plain HTML, CSS and JavaScript. No libraries.</p>
<main>
<a class="g" href="games/tidebound/"><b>Tidebound</b><br>Grab the pearls before the sea rises.</a>
<a class="g" href="games/mirror-mole/"><b>Mirror Mole</b><br>One key, two mirrored moles, two exits.</a>
</main>
</body></html>
