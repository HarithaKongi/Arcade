<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Mole</title>
<style>
:root{--bg:#d6ecea;--ink:#1b2a41;--sea:#3a86b4;--sun:#f4c430;--rose:#d93f6b;--cell:#f3fbfa;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b2b;--ink:#e3f1f0;--cell:#1b2a41}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
p{margin:4px 0;max-width:34rem;text-align:center}
nav{display:flex;gap:8px;margin:14px 0}
button{font:inherit;border:2px solid var(--ink);background:var(--cell);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
button.on{background:var(--sun);color:#1b2a41;font-weight:700}
#board{display:grid;gap:3px;padding:6px;border:3px solid var(--ink);border-radius:14px;background:var(--ink);margin:10px 0}
.c{width:min(11vw,52px);height:min(11vw,52px);background:var(--cell);display:grid;place-items:center;font-size:min(7vw,30px);border-radius:6px;position:relative}
.w{background:var(--sea)}
.wall{background:var(--ink);border:1px solid var(--cell)}
.ex{outline:3px dashed var(--rose);outline-offset:-4px}
.ok{background:var(--sun)}
#status{font-weight:700;min-height:1.6em}
#pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin-top:8px}
#pad button{height:52px;font-size:1.3rem}
nav a{color:inherit;font-weight:700}
</style>
</head>
<body>
<h1>Mirror Mole</h1>
<nav><a href="../../">&larr; All games</a></nav>
<p id="rules"></p>
<div id="status" role="status" aria-live="polite"></div>
<div id="board" aria-label="Game board"></div>
<div id="pad">
  <span></span><button data-d="0,-1" aria-label="Up">&uarr;</button><span></span>
  <button data-d="-1,0" aria-label="Left">&larr;</button><button data-d="0,1" aria-label="Down">&darr;</button><button data-d="1,0" aria-label="Right">&rarr;</button>
</div>
<button id="reset" style="margin-top:14px">Restart</button>

<script>
"use strict";
const $ = id => document.getElementById(id), board = $("board"), status = $("status");
let G = {};

/* ---------- Mirror Mole: one input, two moles, opposite horizontal motion ---------- */
const LEVELS = [
  ["#######","#A...B#","#.....#","#a...b#","#######"],
  ["#######","#A#..B#","#.....#","#..#..#","#a...b#","#######"],
  ["#######","#A..#B#","#.#...#","#.#.#.#","#a..#b#","#######"],
  ["#######","#A...B#","#.##..#","#..#.##","#a.#.b#","#######"]
];
function newMole(lv) {
  lv = lv || 0; const m = LEVELS[lv], f = c => { for (let y = 0; y < m.length; y++) { const x = m[y].indexOf(c); if (x > -1) return [x, y]; } };
  G = { lv, m, A: f("A"), B: f("B"), a: f("a"), b: f("b"), moves: 0, over: false };
  $("rules").textContent = "Both moles move with one key press, but sideways moves are mirrored. Land each on its own dashed exit at the same time.";
  drawMole();
}
function drawMole() {
  const m = G.m; board.style.gridTemplateColumns = "repeat(" + m[0].length + ",auto)"; board.innerHTML = "";
  const eq = (p, x, y) => p[0] === x && p[1] === y;
  m.forEach((row, y) => [...row].forEach((ch, x) => {
    const d = document.createElement("div"); d.className = "c" + (ch === "#" ? " wall" : "");
    if (eq(G.a, x, y) || eq(G.b, x, y)) d.classList.add("ex");
    if (eq(G.A, x, y)) d.textContent = "\u{1F439}"; if (eq(G.B, x, y)) d.textContent = "\u{1F430}";
    if ((eq(G.A, x, y) && eq(G.a, x, y)) || (eq(G.B, x, y) && eq(G.b, x, y))) d.classList.add("ok");
    board.appendChild(d);
  }));
  if (!G.over) status.textContent = "Level " + (G.lv + 1) + "/" + LEVELS.length + " \u2022 Moves " + G.moves;
}
function moveMole(dx, dy) {
  if (G.over) return;
  const step = (p, ax) => G.m[p[1] + dy][p[0] + ax] === "#" ? p : [p[0] + ax, p[1] + dy];
  G.A = step(G.A, dx); G.B = step(G.B, -dx); G.moves++;
  const win = G.A + "" === G.a + "" && G.B + "" === G.b + "";
  drawMole();
  if (win) {
    if (G.lv + 1 < LEVELS.length) { status.textContent = "Solved in " + G.moves + "! Next level..."; G.over = true; setTimeout(() => newMole(G.lv + 1), 900); }
    else { G.over = true; status.textContent = "All levels solved. Nice."; }
  }
}

/* ---------- Shared wiring ---------- */
function start() { newMole(0); }
function move(dx, dy) { moveMole(dx, dy); }
$("reset").onclick = start;
document.querySelectorAll("#pad button").forEach(b => b.onclick = () => move(...b.dataset.d.split(",").map(Number)));
const keys = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1], ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
addEventListener("keydown", e => { const k = keys[e.key]; if (k) { e.preventDefault(); move(...k); } });
start();
</script>
</body>
</html>
